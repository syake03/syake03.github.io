<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>作品カットの版下(共通枠)</title>
<!--
  各プロダクトの画(assets/shot-*.jpg)を作る共通の枠。1000x660で撮る。
  ?img=... で中身を差し替える。なかみの本棚(tools/nakami-hero.html)と
  同じ地色・同じ端末の形にして、一覧の見え方を揃えるためのもの。
  ?mode=square にすると端末枠ではなく正方形のジャケット表示(ラジオ用)。
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1000px;height:660px;overflow:hidden;background:#EAE5D9;
    display:flex;justify-content:center;align-items:flex-start;
    font-family:"Hiragino Sans",sans-serif;
  }
  .phone{
    width:474px;margin-top:44px;height:616px;overflow:hidden;
    background:#F7F4ED;border:1px solid #CFC8B8;border-radius:30px 30px 0 0;
  }
  .phone img{width:100%;display:block}
  /* 正方形ジャケット(ラジオ) */
  body.square{align-items:center}
  .square .jacket{width:380px;height:380px;border:1px solid #CFC8B8;overflow:hidden;background:#fff}
  .square .jacket img{width:100%;height:100%;object-fit:cover;display:block}
  /* 横長の帯(サイトのヘッダー/ロゴだけを見せる) */
  body.wide{align-items:center}
  .wide .band{width:760px;border:1px solid #CFC8B8;overflow:hidden;line-height:0}
  .wide .band img{width:100%;display:block}
</style></head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const img = q.get('img') || '';
  const mode = q.get('mode') || 'phone';
  if (mode === 'square') {
    document.body.classList.add('square');
    document.body.innerHTML = '<div class="jacket"><img src="'+img+'"></div>';
  } else if (mode === 'wide') {
    document.body.classList.add('wide');
    document.body.innerHTML = '<div class="band"><img src="'+img+'"></div>';
  } else {
    document.body.innerHTML = '<div class="phone"><img src="'+img+'"></div>';
  }
</script>
</body></html>
