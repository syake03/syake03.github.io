<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP source</title>
<!--
  OGP画像(1200x630)の版下。サイト本体のヒーローと同じ「文字だけ・中央」。
  書き出し: README.md の手順どおり headless Chrome で撮って assets/ogp.jpg へ。
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden;
    background:#FAF9F6; color:#22201C;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  h1 { font-weight:300; font-size:88px; line-height:1; letter-spacing:.5em; padding-left:.5em; }
  .lede { margin-top:52px; font-size:27px; letter-spacing:.1em; color:#6E675B; font-feature-settings:"palt"; }
  .works {
    position:absolute; bottom:64px; left:0; right:0;
    display:flex; justify-content:center; gap:14px 26px;
    font-size:17px; letter-spacing:.06em; color:#6E675B;
  }
  .works .sep { color:#C9C2B4; }
</style>
</head>
<body>
  <h1>MIYAKE</h1>
  <p class="lede">好きなエンタメの、入り口と出口をつくっています。</p>
  <div class="works">
    <b>なかみの本棚</b><span class="sep">/</span>
    <b>Sumi</b><span class="sep">/</span>
    <b>ニュースタンダードラジオ</b><span class="sep">/</span>
    <b>Jのミカタ</b>
  </div>
</body>
</html>
